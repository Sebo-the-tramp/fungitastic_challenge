[project]
name = "fungitastic2026"
version = "0.1.0"
description = "Few-shot semantic segmentation experiments on FungiTastic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations==2.0.8",
    "fgvc @ https://github.com/BohemianVRA/FGVC/releases/download/v1.5.4-dev/fgvc-1.5.4.dev0-py3-none-any.whl",
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "open-clip-torch>=3.0",
    "opencv-python==4.13.0.92",
    "pandas==3.0.2",
    "pillow==12.2.0",
    "pyyaml>=6.0",
    "rich==14.3.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "timm==1.0.26",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm==4.67.3",
    "transformers>=4.50",
    "wandb>=0.19",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
